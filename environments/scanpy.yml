# `scanpy_env` environment for the WMB-10X atlas scripts (scripts/wmb10x/,
# experiments/wmb10x_landscape/, experiments/merfish_expression_prior/).
# Needed only to reproduce the paper's atlas figures. Those scripts import
# `duet` from the source tree via PYTHONPATH=src rather than installing it.
#
# Exported on 2026-09-24 from the lab's `scanpy_env` (Python 3.11.14) with
# `conda env export --from-history` plus its pip packages.
name: scanpy_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - ipykernel
  - pip
  - pip:
      - anndata==0.12.10
      - array-api-compat==1.13.0
      - contourpy==1.3.3
      - cycler==0.12.1
      - donfig==0.8.1.post1
      - fonttools==4.61.1
      - google-crc32c==1.8.0
      - h5py==3.15.1
      - igraph==1.0.0
      - joblib==1.5.3
      - kiwisolver==1.4.9
      - legacy-api-wrap==1.5
      - leidenalg==0.11.0
      - llvmlite==0.46.0
      - matplotlib==3.10.8
      - natsort==8.4.0
      - networkx==3.6.1
      - numba==0.63.1
      - numcodecs==0.16.5
      - numpy==2.3.5
      - pandas==2.3.3
      - patsy==1.0.2
      - pillow==12.1.0
      - pynndescent==0.6.0
      - pyparsing==3.3.2
      - pytz==2025.2
      - pyyaml==6.0.3
      - scanpy==1.11.5
      - scikit-learn==1.8.0
      - scipy==1.16.3
      - seaborn==0.13.2
      - session-info2==0.3
      - statsmodels==0.14.6
      - texttable==1.7.0
      - threadpoolctl==3.6.0
      - tqdm==4.67.3
      - tzdata==2025.3
      - umap-learn==0.5.11
      - zarr==3.1.5
