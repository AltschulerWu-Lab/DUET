# Smoke config (VARIANT=smoke): config.yaml with N = 2000 reads per file,
# outputs under results/smoke/, and no reference matrices to compare (the
# provenance check reports "skipped"). It still needs the NIS-seq input files.
# config.yaml has the full description.

# Holds NIS-seq_HeLa_IL1b/ (the 8 spot-level base-call files) and Brunello_sgRNAs/.
# Override with NISSEQ_DATA_DIR / NISSEQ_LIBRARY_PATH (relative to your cwd).
data_dir: ../../data/raw/NISseq_HeLa_IL1b
library_path: ../../data/raw/NISseq_HeLa_IL1b/Brunello_sgRNAs/Brunello_sgRNAs.txt

# One subfolder per subsample size: <outdir>/subsample<N>/{figures,noise_matrices}/,
# the executed notebook beside them, logs in <outdir>/logs/.
outdir: ../../results/smoke/nisseq_error_analysis

# Reads per file (the first N rows of each of the 8 files). Override with
# SUBSAMPLE_NS="5000" etc. Which figure uses which:
#   5000   -> Supp S3a panel (error_lines_4_pctl50_subsample5000.svg)
#   50000  -> the S3b matrices (channels/nisseq/*_pctl50_subsample50000.npy)
#   100000 -> the Fig 3d-f / S3c matrices (channels/archive/nisseq_hela_*_subsample.npy)
subsample_ns: [2000]

# sha256 of every input, checked by run.sh before any work (CHECK_INPUT_HASHES=0
# skips it). Keys under data_dir, plus the library.
