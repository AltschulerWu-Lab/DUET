# Provenance check (check_provenance.py), per subsample size: the reference files
# the four regenerated matrices must equal byte for byte ({kind} = uniform,
# positional, channel, positional_channel). A size not listed here is reported as
# skipped, and so is a reference file missing from your copy: the NIS-seq
# channel matrices are included only with the permission of the authors of
# Fandrey et al. (2025), who shared the spot-level base calls on request.
provenance:
  5000: ../../scripts/benchmark/noise_model_matrices/channels/nisseq/nisseq_hela_{kind}_pctl50_subsample5000.npy
  50000: ../../scripts/benchmark/noise_model_matrices/channels/nisseq/nisseq_hela_{kind}_pctl50_subsample50000.npy
  100000: ../../scripts/benchmark/noise_model_matrices/channels/archive/nisseq_hela_{kind}_subsample.npy
