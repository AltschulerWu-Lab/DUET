# tests/regression/data/ops_config_post.yaml
# Post-refactor OPS config for regression tests (Step 15).
# Semantically equivalent to ops_config_pre.yaml per these migration rules:
#   - guide_candidates:     -> candidate_pool:
#   - guides_per_gene:      -> quota:
#   - num_ntc:              -> num_controls:
#   - num_genes:            -> num_groups:
#   - min_guide_rank:       -> min_rank:
#   - duet.optimizer.crowding_weight: <removed>
#
# Note: ops_config_pre.yaml already used all new key names (candidate_pool,
# quota, num_controls, etc.), so this file is structurally identical aside
# from the header comment above.
outdir: out/ops-snapshot  # placeholder: the tests write to a pytest tmp_path
trials: 1
seed: 42
device: cpu

candidate_pool:
  source: synthetic
  seq_rounds: 5
  quota: 1
  num_controls: 0
  num_groups: 10
  candidates_per_group: 5
  alphabet_size: 4

evaluator:
  noise_channel:
    type: symmetric
    epsilon: 0.1
  decoding_metric:
    type: hamming
  decoding_rule:
    type: unique_minimum
  num_samples: 1000
  num_cpus: 2
  seed: 42

duet:
  initialization:
    type: random
  optimizer:
    lambda: [0.0, 1.0]
    temperature: 0.0
    max_iter: 1000
    max_patience: 200
    num_cpus: 1
  pep:
    noise_channel:
      type: symmetric
      epsilon: 0.1
    decoding_metric:
      type: hamming
    decoding_rule:
      type: unique_minimum
    num_samples: 1000
    num_cpus: 2
    seed: 42
